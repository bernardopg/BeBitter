allowBuilds:
  "@swc/core": true
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - "@vitejs/plugin-react@6.1.2"

overrides:
  "@eslint/plugin-kit": ">=0.7.2"
  "@opentelemetry/core": "^2.8.0"
  # ponytail: GHSA de DoS por arrays intermediários sem limite; 5.0.8 e abaixo
  # burlam a mitigação de CVE-2026-14257. Corrigido em 5.0.9.
  brace-expansion: ">=5.0.9"
  # ponytail: removido pin rolldown 1.2.1 (de jul/2026) — vite 8.3.2 exige
  # rolldown ~1.2.11; sem o override o pnpm resolve 1.2.12 (último 1.2.x).
  # ponytail: typescript-eslint 8.x supports TS <6.1.0 only; pin TS 6 until a
  # typescript-eslint release declares TypeScript 7 support.
  typescript: "^6.0.3"
  # ponytail: vitest 5.0.0 restructured @vitest/expect internals; @testing-library/jest-dom's
  # type augmentation (toBeInTheDocument, toHaveClass, ...) stops resolving under TS, breaking
  # `pnpm typecheck` across every test file. Pin vitest/@vitest/ui at 4.x until jest-dom (or a
  # vitest patch) restores the Assertion interface these types merge into.
  vitest: "^4.1.11"
  "@vitest/ui": "^4.1.11"
