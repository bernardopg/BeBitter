version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
    groups:
      runtime-dependencies:
        dependency-type: "production"
      tooling-and-tests:
        dependency-type: "development"
    ignore:
      - dependency-name: "react-day-picker"
        versions:
          - ">=9.14.0"
      # typescript-eslint 8.x declara peer typescript <6.1.0, então TS 7 quebra
      # o lint (ver 1b13544). Remover quando typescript-eslint suportar TS 7.
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
