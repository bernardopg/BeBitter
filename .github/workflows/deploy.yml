name: Production delivery
run-name: ${{ inputs.dry_run && 'Dry run' || 'Production' }} ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and preview the Hostinger upload without writing files
        type: boolean
        default: false

permissions: {}
concurrency:
  group: bebitter-production
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'bernardopg/BeBitter' && github.ref == 'refs/heads/main'
    name: Validate production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reuse the published archive on redeploy
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$(bash scripts/publish-release.sh --tag-at-head)
          if [[ -n "$tag" ]] && release=$(gh release view "$tag" --json assets 2>/dev/null); then
            asset="bebitter-dist-$tag.tar.gz"
            if jq -e --arg asset "$asset" 'any(.assets[]; .name == $asset and .size > 0)' <<< "$release" >/dev/null; then
              gh release download "$tag" --pattern "$asset" --output bebitter-dist.tar.gz
              revision=$(tar -xOf bebitter-dist.tar.gz ./deploy-revision.txt)
              [[ "$revision" == "$GITHUB_SHA" ]]
              echo "reused=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: pnpm/action-setup@v6.1.1
        if: steps.archive.outputs.reused != 'true'
      - uses: actions/setup-node@v7.1.0
        if: steps.archive.outputs.reused != 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.archive.outputs.reused != 'true'
        run: pnpm install --frozen-lockfile
      - name: Build with production settings
        if: steps.archive.outputs.reused != 'true'
        env:
          VITE_SITE_URL: https://bebitterbebetter.com.br
          VITE_GA_TRACKING_ID: ${{ secrets.VITE_GA_TRACKING_ID }}
          VITE_CAL_URL: ${{ vars.VITE_CAL_URL }}
        run: pnpm ci:check
      - if: steps.archive.outputs.reused != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.archive.outputs.reused != 'true'
        run: pnpm test:site
      - name: Package tested files
        if: steps.archive.outputs.reused != 'true'
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/deploy-revision.txt
          tar -czf bebitter-dist.tar.gz -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-dist
          path: bebitter-dist.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    name: Publish tested files to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://bebitterbebetter.com.br
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-dist
      - name: Deploy and verify public site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_REMOTE_DIR: ${{ secrets.DEPLOY_REMOTE_DIR }}
          DEPLOY_KEEP_BACKUPS: ${{ vars.DEPLOY_KEEP_BACKUPS || '5' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" != "$GITHUB_SHA" ]]; then
            echo "::error::A main avançou. Execute o deploy para o commit atual."
            exit 1
          fi
          mkdir dist
          tar -xzf bebitter-dist.tar.gz -C dist
          grep -Fxq "$GITHUB_SHA" dist/deploy-revision.txt
          umask 077
          mkdir -p ~/.ssh
          export DEPLOY_SSH_KEY_PATH="$RUNNER_TEMP/bebitter-deploy-key"
          trap 'rm -f "$DEPLOY_SSH_KEY_PATH" ~/.ssh/known_hosts' EXIT
          printf '%s\n' "${SSH_KEY:?Missing DEPLOY_SSH_KEY}" > "$DEPLOY_SSH_KEY_PATH"
          printf '%s\n' "${SSH_KNOWN_HOSTS:?Missing DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          unset SSH_KEY SSH_KNOWN_HOSTS GH_TOKEN
          args=(--skip-build)
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          node scripts/deploy.ts "${args[@]}"
      - name: Notify IndexNow
        if: inputs.dry_run != true
        continue-on-error: true
        env:
          VITE_SITE_URL: https://bebitterbebetter.com.br
        run: node scripts/indexnow-ping.ts

  release:
    needs: deploy
    if: inputs.dry_run != true
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-dist
      - name: Tag and attach the deployed archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-release.sh

  notify:
    needs: [build, deploy, release]
    if: always() && github.repository == 'bernardopg/BeBitter' && github.ref == 'refs/heads/main' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report delivery problems
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.release.result }}
        run: |
          title='BeBitter: entrega de produção bloqueada'
          if [[ "$RESULT" == success ]]; then
            bash scripts/automation-issue.sh "$title"
          elif [[ "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" == "$GITHUB_SHA" ]]; then
            bash scripts/automation-issue.sh "$title" "Falha na entrega de $GITHUB_SHA. Veja [$GITHUB_RUN_ID]($RUN_URL). Após corrigir, rode **Production delivery** na main."
          fi
